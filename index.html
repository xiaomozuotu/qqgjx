    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body{
            background-color:#050710;
            /* 正确无缝网格背景 */
            background-image:
                repeating-linear-gradient(to right, rgba(32, 210, 182, 0.04) 0 1px, transparent 1px 25px),
                repeating-linear-gradient(to bottom, rgba(32, 210, 182, 0.04) 0 1px, transparent 1px 25px),
                radial-gradient(ellipse at 30% 50%, rgba(16, 220, 180, 0.18) 0%, transparent 55%),
                radial-gradient(ellipse at 70% 60%, rgba(16, 220, 180, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 25%, rgba(20, 190, 220, 0.12) 0%, transparent 50%);
            background-size:
                25px 25px,
                25px 25px,
                100% 100%,
                100% 100%,
                100% 100%;
            background-position: center center;
            background-repeat: repeat, repeat, no-repeat, no-repeat, no-repeat;
            min-height:100vh;
        }
        /* 页面震动动画 密码错误 */
        @keyframes shake {
            0%,100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-8px); }
            80% { transform: translateX(8px); }
        }
        .shake{
            animation: shake 0.4s ease;
        }
        .login-box{
            background:rgba(40,48,70,0.35);
            backdrop-filter: blur(8px);
            border:1px solid rgba(32, 210, 182, 0.25);
            /* 圆角小窗口 */
            border-radius: 16px;
            width: 100%;
            max-width: 360px;
        }
        .login-input{
            background:rgba(20,28,45,0.5);
            border:1px solid rgba(32, 210, 182, 0.3);
            color:#fff;
            outline:none;
        }
        .login-input:focus{
            border-color:rgba(34, 216, 194, 0.85);
            box-shadow: 0 0 12px rgba(32, 210, 182,0.4);
        }
        .login-btn{
            background:rgba(40,48,70,0.45);
            border:1px solid rgba(32, 210, 182, 0.35);
            transition: all 0.25s ease;
        }
        .login-btn:hover{
            border-color:rgba(34, 216, 194, 0.85);
            background:rgba(44, 62, 88, 0.55);
            box-shadow: 0 6px 20px rgba(32, 210, 182, 0.45);
        }
        .btn-item{
            background:rgba(40,48,70,0.35);
            backdrop-filter: blur(8px);
            border:1px solid rgba(32, 210, 182, 0.25);
            transition: all 0.25s ease;
            display:flex;
            align-items:center;
            gap:8px;
            justify-content:flex-start;
            padding-left:12px;
            min-width:140px;
            flex: 0 1 160px;
            cursor:pointer;
        }
        /* 按钮hover青蓝色高亮发光 */
        .btn-item:hover{
            border-color:rgba(34, 216, 194, 0.85);
            background:rgba(44, 62, 88, 0.5);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(32, 210, 182, 0.45);
        }
        .char-icon{
            width:36px;
            height:36px;
            border-radius:8px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-weight:bold;
            font-size:20px;
            background-clip:text;
            -webkit-background-clip:text;
            color:transparent;
            background-image:linear-gradient(135deg,#20d2b6,#22b8e8);
            box-shadow: 0 0 4px rgba(32, 210, 182,0.3), inset 0 0 3px rgba(34,184,232,0.2);
            transition: all 0.25s ease;
            flex-shrink:0;
        }
        .btn-item:hover .char-icon{
            box-shadow: 0 0 10px rgba(32, 210, 182,0.6), inset 0 0 6px rgba(34,184,232,0.4);

        .group-title-wrap{
            display:flex;
            align-items:center;
            gap:10px;
            margin-bottom:12px;
        }
        .decor-line-short{
            width:4px;
            height:18px;
            background:linear-gradient(180deg,#20d2b6,#22b8e8);
            border-radius:2px;
        }
        .divider-line{
            flex:1;
            height:1px;
            background:linear-gradient(90deg, rgba(32, 210, 182,0.4),transparent);
        }
        a{
            text-decoration: none;
            color:white;
        }
        .tool-item{
            opacity:0;
            animation: fadeIn 0.25s ease forwards;
        }
        @keyframes fadeIn{

        }
        /* 登录页、主页面容器 */

        }

        // 登录逻辑
        const loginPage = document.getElementById('login-page');

        const pwdInput = document.getElementById('pwd-input');
        const loginBtn = document.getElementById('login-btn');
        const errTip = document.getElementById('err-tip');

        function doLogin(){
            const val = pwdInput.value.trim();
            if(val === PASSWORD){
                loginPage.style.display="none";
                mainPage.style.display="block";
                buildPage();
                refreshDateTime();
            }else{
                // 震动+提示
                loginPage.classList.add('shake');
                errTip.classList.remove('hidden');
                setTimeout(()=>{
                    loginPage.classList.remove('shake');
                },400);
            }
        }
        loginBtn.addEventListener('click',doLogin);
        pwdInput.addEventListener('keydown',(e)=>{
            if(e.key === 'Enter') doLogin();
        });

        function refreshDateTime(){
            const d = new Date();
            let h = String(d.getHours()).padStart(2,'0');
            let m = String(d.getMinutes()).padStart(2,'0');
            let s = String(d.getSeconds()).padStart(2,'0');
            document.getElementById("now-time").innerText = `${h}:${m}:${s}`;
            const month = d.getMonth() + 1;
            const day = d.getDate();
            const week = weekText[d.getDay()];
            document.getElementById("now-date").innerText = `${month}月${day}日 ${week}`;
        }
        setInterval(refreshDateTime, 1000);

        // 渲染主界面
        function buildPage(){
            const box = document.getElementById("container");

            const groups = ["系统工具","声卡驱动","宿主机架","效果插件","其他软件","播放器类","直播软件"];
            let staggerIndex = 0;
            groups.forEach(gName=>{
                const items = linkList.filter(x=>x.group === gName);
                const wrap = document.createElement("div");
                wrap.className = "mb-7";
                wrap.innerHTML = `
                <div class="group-title-wrap">
                    <span class="decor-line-short"></span>
                    <span class="text-cyan-300 text-lg">${gName}</span>
                    <span class="divider-line"></span>
                </div>
                <div class="flex flex-wrap gap-3">
                </div>`;
                const btnWrap = wrap.querySelector("div:last-child");
                items.forEach(item=>{
                    staggerIndex += 1;
                    const div = document.createElement("div");
                    div.className = "btn-item px-4 py-3 rounded-lg tool-item";
                    div.style.animationDelay = staggerIndex * 0.04 + "s";
                    let firstChar = item.name.charAt(0);
                    if(/[a-z]/.test(firstChar)) firstChar = firstChar.toUpperCase();
                    let displayName = item.name.replace(/官网/g,'').replace(/备用/g,'');
                    div.innerHTML = `
                    <span class="char-icon">${firstChar}</span>
                    <span class="text-white text-sm">${displayName}</span>`;
                    // 点击事件：打开默认浏览器
                    div.onclick = ()=> openExternal(item.url);
                    btnWrap.appendChild(div);
                });
                box.appendChild(wrap);
            });
